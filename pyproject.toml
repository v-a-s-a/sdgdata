[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyunsdg"
version = "0.1.0"
description = "Simple Python client for the United Nations Statistics Division SDG API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.3",
]

[dependency-groups]
dev = [
    "openapi-python-client==0.28.4",
    "pytest>=8.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
markers = [
    "mock: deterministic tests that mock the UNSD API",
    "live: tests that call the live UNSD API",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = [
    "generated/openapi_python_client",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyunsdg*"]
